name: Release

# Three paths reach this workflow, and only one of them arrives by pushing a
# tag. A tag pushed with the default GITHUB_TOKEN does not create a new workflow
# run, so the two cut workflows push their tag and then call this workflow
# directly. Publishing therefore has one implementation and three entrances,
# rather than a second copy reachable only from Actions.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, such as v0.5.0
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
      # Handed on to the desktop release this run cascades into, which signs
      # and notarizes its Mac build with them. Optional, as they are there.
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

# A called run's github.ref is the caller's branch, so keying on it would group
# every called release together and let one wait on an unrelated one.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REPOSITORY: dgoings/workbook
  TAP_REPOSITORY: dgoings/homebrew-tap

jobs:
  release:
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      newest: ${{ steps.standing.outputs.newest }}
    steps:
      # The full depth carries every tag and the remote's branches, which the
      # branch check and the newest-release question below both read.
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # A tag off main publishes code nobody merged, and an older version on
      # newer code publishes that code under the older number.
      - name: Validate release tag
        run: |
          VERSION=$(scripts/validate-release-tag.sh "${RELEASE_TAG}")
          scripts/validate-release-branch.sh "${RELEASE_TAG}"
          printf 'VERSION=%s\n' "${VERSION}" >> "${GITHUB_ENV}"

      # Only the newest release moves what users are pointed at. An older one,
      # a patch to a line main has moved past, publishes quietly: it is on the
      # Releases page, but Latest, brew and the desktop app stay on the newest
      # release, and it cascades into no desktop build. publish-release.sh asks
      # the same question of the same checkout for Latest and the tap.
      - name: Decide whether this is the newest release
        id: standing
        run: |
          if newer=$(scripts/release-is-newest.sh "${RELEASE_TAG}"); then
            printf 'newest=true\n' >> "${GITHUB_OUTPUT}"
          else
            status=$?
            # Anything but 1 is a question that could not be answered, and
            # reading it as either answer would be a guess.
            if [ "${status}" -ne 1 ]; then
              exit "${status}"
            fi
            printf '::notice title=Quiet release::%s is older than %s, so Latest, the Homebrew tap and the desktop app stay on %s, and no desktop release is cut for it.\n' "${RELEASE_TAG}" "${newer}" "${newer}"
            printf 'newest=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"

      - name: Test
        run: go test ./...

      - name: Build release archives
        run: scripts/release.sh "${VERSION}" dist

      # A pre-release never touches the tap, so an expired tap token must not fail it.
      - name: Check out Homebrew tap
        if: ${{ !contains(env.VERSION, '-rc') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dgoings/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish release and Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "${RELEASE_TAG}" dist homebrew-tap "${REPOSITORY}"

  # Every newest CLI release reaches desktop users: the companion desktop
  # release is cut from the same commit, bundling the CLI just published. The
  # one environment approval above covers this run; the desktop tag is pushed
  # and the desktop workflow called directly, since a tag pushed with the
  # default token starts no run of its own. An older release skips this job,
  # and with it desktop-publish, rather than reaching a planner that would
  # refuse it; the release job's notice says so.
  desktop-tag:
    needs: release
    if: needs.release.outputs.newest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The planner refuses rather than guess when the desktop sequence has
      # moved ahead of the CLI's number, and says how to cut that release by
      # hand. A failure here leaves the CLI release published and intact.
      - name: Plan and push the desktop tag
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version=$(scripts/validate-release-tag.sh "${RELEASE_TAG}")
          tag=$(scripts/plan-desktop-release.sh --cli-version "${version}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" --message "Workbench ${tag}"
          git push origin "refs/tags/${tag}"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

  desktop-publish:
    needs: desktop-tag
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.desktop-tag.outputs.tag }}
    # A called workflow sees no secrets its caller does not pass, and without
    # these the cascaded Mac build would quietly ship ad-hoc signed.
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
