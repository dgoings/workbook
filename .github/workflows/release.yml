name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  REPOSITORY: dgoings/workbook
  TAP_REPOSITORY: dgoings/homebrew-tap

jobs:
  release:
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          VERSION=$(scripts/validate-release-tag.sh "${GITHUB_REF_NAME}")
          printf 'VERSION=%s\n' "${VERSION}" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.5"

      - name: Test
        run: go test ./...

      - name: Build release archives
        run: scripts/release.sh "${VERSION}" dist

      - name: Check out Homebrew tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: dgoings/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish release and Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "${GITHUB_REF_NAME}" dist homebrew-tap "${REPOSITORY}"
