name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  REPOSITORY: dgoings/workbook
  TAP_REPOSITORY: dgoings/homebrew-tap

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build release archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/release.sh "${VERSION}" dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/workbook_${VERSION}_darwin_arm64.tar.gz" \
              "dist/workbook_${VERSION}_darwin_amd64.tar.gz" \
              dist/checksums.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/workbook_${VERSION}_darwin_arm64.tar.gz" \
              "dist/workbook_${VERSION}_darwin_amd64.tar.gz" \
              dist/checksums.txt \
              --generate-notes \
              --title "Workbook ${GITHUB_REF_NAME}"
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: dgoings/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/render-homebrew-formula.sh "${VERSION}" dist/checksums.txt \
            homebrew-tap/Formula/workbook.rb "${REPOSITORY}"
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/workbook.rb
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "workbook ${VERSION}"
            git -C homebrew-tap push origin HEAD
          fi
