name: Release

# Three paths reach this workflow, and only one of them arrives by pushing a
# tag. A tag pushed with the default GITHUB_TOKEN does not create a new workflow
# run, so the two cut workflows push their tag and then call this workflow
# directly. Publishing therefore has one implementation and three entrances,
# rather than a second copy reachable only from Actions.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, such as v0.5.0
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

# A called run's github.ref is the caller's branch, so keying on it would group
# every called release together and let one wait on an unrelated one.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REPOSITORY: dgoings/workbook
  TAP_REPOSITORY: dgoings/homebrew-tap

jobs:
  release:
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          VERSION=$(scripts/validate-release-tag.sh "${RELEASE_TAG}")
          printf 'VERSION=%s\n' "${VERSION}" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"

      - name: Test
        run: go test ./...

      - name: Build release archives
        run: scripts/release.sh "${VERSION}" dist

      # A pre-release never touches the tap, so an expired tap token must not fail it.
      - name: Check out Homebrew tap
        if: ${{ !contains(env.VERSION, '-rc') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dgoings/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish release and Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "${RELEASE_TAG}" dist homebrew-tap "${REPOSITORY}"

  # Every CLI release reaches desktop users: the companion desktop release is
  # cut from the same commit, bundling the CLI just published. The one
  # environment approval above covers this run; the desktop tag is pushed and
  # the desktop workflow called directly, since a tag pushed with the default
  # token starts no run of its own.
  desktop-tag:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The planner refuses rather than guess when the desktop sequence has
      # moved ahead of the CLI's number, and says how to cut that release by
      # hand. A failure here leaves the CLI release published and intact.
      - name: Plan and push the desktop tag
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version=$(scripts/validate-release-tag.sh "${RELEASE_TAG}")
          tag=$(scripts/plan-desktop-release.sh --cli-version "${version}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" --message "Workbench ${tag}"
          git push origin "refs/tags/${tag}"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

  desktop-publish:
    needs: desktop-tag
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.desktop-tag.outputs.tag }}
